name: Sync skills from agent-skills

on:
  repository_dispatch:
    types: [agent-skills-release]
  schedule:
    - cron: "0 6 * * 1" # Weekly on Monday at 06:00 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync from (e.g. v0.3.0). Leave empty for latest."
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync skills
    runs-on: ubuntu-latest
    steps:
      # A GitHub App token (not the default GITHUB_TOKEN) is required so the
      # pull request this job opens actually triggers validate.yml. GitHub does
      # not run on:pull_request workflows for events raised by GITHUB_TOKEN, so
      # the previous version's sync PRs landed with ZERO CI — letting registry
      # drift (issue #100) merge unchecked. Reuses the release app credentials.
      #
      # REQUIRED APP PERMISSIONS: the RELEASE_APP GitHub App installation must
      # grant BOTH "Contents: write" and "Pull requests: write". release.yml
      # only exercises Contents (push + create release), so the Pull-requests
      # grant may be missing — without it `gh pr create` below returns HTTP 403.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          # Priority: dispatch payload > manual input > latest release
          if [ -n "$DISPATCH_TAG" ]; then
            TAG="$DISPATCH_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release view --repo nq-rdl/agent-skills --json tagName -q '.tagName')
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Syncing from agent-skills@${TAG}"

      - name: Clone agent-skills at release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git clone --branch "$TAG" --depth 1 \
            https://github.com/nq-rdl/agent-skills.git \
            /tmp/agent-skills

          # Remove existing vendored skills (preserving any non-skill files)
          for dir in skills/*/; do
            [ -f "$dir/SKILL.md" ] && rm -rf "$dir"
          done

          # Copy fresh skills from agent-skills/skills/ → skills/
          cp -r /tmp/agent-skills/skills/* skills/

      - name: Re-sync plugin trees
        # Plugins are installed via cp -R, which preserves symlinks but
        # dangles their targets. plugins/<bundle>/skills/<name>/ holds a
        # real-file copy of skills/<name>/; this step refreshes those
        # copies so the plugin tree stays self-contained. See issue #83.
        run: |
          python3 -m pip install --user pyyaml
          bash scripts/sync-plugins.sh

      - name: Check for changes
        id: changes
        run: |
          # `git status --porcelain` reports untracked files, unlike a plain
          # tracked-only diff check — so a sync that only ADDS new skill
          # directories is no longer silently skipped (audit #5).
          if [ -z "$(git status --porcelain skills/ plugins/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No skill changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Skill changes detected:"
            git status --short skills/ plugins/ | head -50
          fi

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          BRANCH="chore/sync-skills-${TAG}"

          # Idempotency: the branch name is deterministic, so a duplicate trigger
          # for the same tag must not fail `git push` (which would fail the job
          # and open a spurious "sync failed" tracking issue). Skip cleanly if the
          # branch already exists on the remote.
          if git ls-remote --exit-code origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists — duplicate trigger for $TAG; skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add skills/ plugins/
          git commit -m "chore(skills): sync from agent-skills@${TAG}"

          git push -u origin "$BRANCH"

          # Detect registry drift: bundles still referencing skills that were
          # removed upstream. The plugin trees are auto-pruned by sync-plugins.sh,
          # but the human-curated registry is NOT auto-edited — instead we surface
          # exactly what to reconcile in the PR body. validate-bundles (which now
          # runs on this PR via the app token) is the hard gate that blocks merge.
          DRIFT="$(python3 scripts/check_bundle_refs.py . 2>&1 1>/dev/null \
            | sed -E 's/^::error[^:]*:: *//' \
            | grep -v 'unresolved bundle reference' || true)"

          # Build a concise PR body (added/removed/modified skills + drift),
          # instead of dumping a 60k-line `git diff --stat` that can exceed
          # GitHub's 65,536-char body limit (audit #6).
          # Pass the repo root so the PR body can flag synced-but-unmapped skills
          # (copied from upstream but not yet referenced by any bundle, so not
          # installable until a maintainer maps them — see CONTRIBUTING).
          git diff --name-status HEAD~1 HEAD \
            | SYNC_DRIFT="$DRIFT" python3 scripts/sync_pr_body.py "$TAG" . > /tmp/pr-body.md

          gh pr create \
            --title "chore(skills): sync from agent-skills@${TAG}" \
            --body-file /tmp/pr-body.md \
            --label "dependencies"

  notify-failure:
    name: Alert on sync failure
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="sync-skills workflow failed"
          body="The scheduled or dispatched sync-skills workflow failed (run: ${RUN_URL}). Likely cause: a bundle in registry/bundles/*.yaml references a skill or agent that no longer exists upstream after a rename or removal. sync-plugins.sh now warns instead of aborting, so check the run logs for ::warning:: lines, reconcile the registry, then re-run the sync."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title $title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
