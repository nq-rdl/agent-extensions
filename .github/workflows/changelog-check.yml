name: Changelog Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-changie-fragment:
    runs-on: ubuntu-latest
    # Dependabot PRs never carry a changie fragment; skip the gate for them
    # (the bot has no way to run `changie new`). Human PRs still require one.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') && github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install pyyaml (changie length linter)
        run: python3 -m pip install --user pyyaml

      - name: Check for unreleased changie fragment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FRAGMENTS=$(git diff --name-only --diff-filter=A "$BASE_SHA"..."$HEAD_SHA" -- '.changes/unreleased/*.yaml')

          if [ -z "$FRAGMENTS" ]; then
            echo "::error::No changie fragment found. Please run 'changie new' and commit the generated file in .changes/unreleased/."
            echo ""
            echo "If this PR does not need a changelog entry, add the 'skip-changelog' label."
            exit 1
          fi

          echo "Found changie fragment(s):"
          echo "$FRAGMENTS"

          # Enforce the per-fragment body length cap on the fragments *added* on
          # this branch only (diff-filter=A) — released versions and pre-existing
          # unreleased fragments are never retroactively flagged. Mirrors the
          # local pre-commit `changie-length` job (lefthook.yml). Override with
          # CHANGIE_MAX_BODY_LENGTH; keep it in sync with .changie.yaml body.maxLength.
          echo "$FRAGMENTS" | xargs python3 scripts/check_changie_length.py
