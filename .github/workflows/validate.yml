name: Validate

on:
  pull_request:
    branches: [main, 'release/*']
  push:
    branches: [main, 'release/*']

permissions:
  contents: read

jobs:
  validate-bundles:
    name: Validate bundle references + registry consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      # Logic lives in tested, importable scripts (tests/test_check_*.py) rather
      # than inline here, so it is unit-tested and reused by sync-skills.yml.
      - name: Check bundle references resolve
        run: python3 scripts/check_bundle_refs.py .

      - name: Check skill grouping contract
        run: python3 scripts/check_grouping.py .

      - name: Check generated manifests are in sync
        run: python3 scripts/generate_manifests.py . --check

      - name: Check registry / marketplace / plugins consistency
        run: python3 scripts/check_consistency.py .

  validate-symlinks:
    name: Validate skill + agent symlinks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check all symlinks resolve
        run: |
          mapfile -t links < <(find plugins/ -type l 2>/dev/null)
          if [ ${#links[@]} -eq 0 ]; then
            echo "No symlinks to validate"
            exit 0
          fi

          exit_code=0
          for link in "${links[@]}"; do
            if [ ! -e "$link" ]; then
              echo "::error::Broken symlink: $link -> $(readlink "$link")"
              exit_code=1
            else
              echo "✓ $link -> $(readlink "$link")"
            fi
          done
          if [ $exit_code -eq 0 ]; then
            echo "All symlinks are valid"
          fi
          exit $exit_code

  validate-plugins:
    name: Validate Claude plugin structure, hooks, and agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install PyYAML for agent frontmatter validation
        run: python3 -m pip install --user pyyaml

      - name: Validate plugin manifests, hooks, and agents
        run: scripts/validate-plugins.sh

  unit-tests:
    name: Unit tests (pipeline scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Run pipeline-script unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
