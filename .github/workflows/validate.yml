name: Validate

on:
  pull_request:
    branches: [main, 'release/*']
  push:
    branches: [main, 'release/*']

permissions:
  contents: read

jobs:
  validate-bundles:
    name: Validate bundle skill + agent references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check bundle references resolve
        run: |
          shopt -s nullglob
          bundles=(registry/bundles/*.yaml registry/bundles/*.yml)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "No bundle manifests to validate"
            exit 0
          fi

          exit_code=0
          for bundle in "${bundles[@]}"; do
            echo "Checking $bundle"
            in_section=""
            while IFS= read -r line; do
              if echo "$line" | grep -qE '^skills:'; then
                in_section="skills"
                continue
              fi
              if echo "$line" | grep -qE '^agents:'; then
                in_section="agents"
                continue
              fi
              if [ -n "$in_section" ]; then
                if echo "$line" | grep -qE '^\s+-\s+'; then
                  item=$(echo "$line" | sed 's/^\s*-\s*//' | tr -d '[:space:]')
                  if [ "$in_section" = "skills" ]; then
                    if [ ! -d "skills/$item" ]; then
                      echo "::error file=$bundle::Skill '$item' not found in skills/"
                      exit_code=1
                    else
                      echo "  ✓ skill:$item"
                    fi
                  elif [ "$in_section" = "agents" ]; then
                    if [ ! -f "agents/$item/agent.md" ]; then
                      echo "::error file=$bundle::Agent '$item' not found at agents/$item/agent.md"
                      exit_code=1
                    else
                      echo "  ✓ agent:$item"
                    fi
                  fi
                else
                  in_section=""
                fi
              fi
            done < "$bundle"
          done
          exit $exit_code

  validate-symlinks:
    name: Validate skill + agent symlinks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check all symlinks resolve
        run: |
          mapfile -t links < <(find plugins/ opencode/ pidev/ .gemini/ -type l 2>/dev/null)
          if [ ${#links[@]} -eq 0 ]; then
            echo "No symlinks to validate"
            exit 0
          fi

          exit_code=0
          for link in "${links[@]}"; do
            if [ ! -e "$link" ]; then
              echo "::error::Broken symlink: $link -> $(readlink "$link")"
              exit_code=1
            else
              echo "✓ $link -> $(readlink "$link")"
            fi
          done
          if [ $exit_code -eq 0 ]; then
            echo "All symlinks are valid"
          fi
          exit $exit_code

  validate-plugins:
    name: Validate Claude Code plugin structure + agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install PyYAML for agent frontmatter validation
        run: python3 -m pip install --user pyyaml

      - name: Validate plugin manifests, hooks, and agents
        run: scripts/validate-plugins.sh

  validate-mcp-servers:
    name: Validate Go MCP servers build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        server:
          - dir: mcp/pi-rpc-go
          - dir: mcp/gemini-cli-go
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.server.dir }}/go.mod

      - name: Download dependencies
        working-directory: ${{ matrix.server.dir }}
        run: go mod download

      - name: Build and vet
        working-directory: ${{ matrix.server.dir }}
        run: |
          go build ./...
          go vet ./...
