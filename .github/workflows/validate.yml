name: Validate

on:
  pull_request:
    branches: [main, 'release/*']
  push:
    branches: [main, 'release/*']

permissions:
  contents: read

jobs:
  validate-bundles:
    name: Validate bundle skill + agent references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Check bundle references resolve
        run: |
          python3 <<'PY'
          import sys
          from pathlib import Path
          import yaml

          repo = Path(".")
          bundles_dir = repo / "registry" / "bundles"
          bundles = sorted(list(bundles_dir.glob("*.yaml")) + list(bundles_dir.glob("*.yml")))
          if not bundles:
              print("No bundle manifests to validate")
              sys.exit(0)

          exit_code = 0
          for bundle in bundles:
              print(f"Checking {bundle}")
              with bundle.open() as f:
                  data = yaml.safe_load(f) or {}
              for name in data.get("skills") or []:
                  if not (repo / "skills" / name).is_dir():
                      print(f"::error file={bundle}::Skill '{name}' not found in skills/")
                      exit_code = 1
                  else:
                      print(f"  ✓ skill:{name}")
              for name in data.get("agents") or []:
                  if not (repo / "agents" / name / "agent.md").is_file():
                      print(f"::error file={bundle}::Agent '{name}' not found at agents/{name}/agent.md")
                      exit_code = 1
                  else:
                      print(f"  ✓ agent:{name}")
          sys.exit(exit_code)
          PY

  validate-symlinks:
    name: Validate skill + agent symlinks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check all symlinks resolve
        run: |
          mapfile -t links < <(find plugins/ -type l 2>/dev/null)
          if [ ${#links[@]} -eq 0 ]; then
            echo "No symlinks to validate"
            exit 0
          fi

          exit_code=0
          for link in "${links[@]}"; do
            if [ ! -e "$link" ]; then
              echo "::error::Broken symlink: $link -> $(readlink "$link")"
              exit_code=1
            else
              echo "✓ $link -> $(readlink "$link")"
            fi
          done
          if [ $exit_code -eq 0 ]; then
            echo "All symlinks are valid"
          fi
          exit $exit_code

  validate-plugins:
    name: Validate Claude plugin structure, hooks, and agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install PyYAML for agent frontmatter validation
        run: python3 -m pip install --user pyyaml

      - name: Validate plugin manifests, hooks, and agents
        run: scripts/validate-plugins.sh
