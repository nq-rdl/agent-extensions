name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.actor != 'nq-rdl-release-bot[bot]'

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify tag points to a commit on main
        env:
          SHA: ${{ github.sha }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Release tags must point to commits already on main."
            exit 1
          fi

      - name: Check for unreleased changes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Releasable when there are unreleased fragments to batch OR this
          # version was already batched ahead of the tag (e.g. a release PR ran
          # `changie batch <version>`). Fail only when neither holds — genuinely
          # nothing to ship.
          if [ -n "$(ls .changes/unreleased/ 2>/dev/null | grep -v .gitkeep)" ]; then
            echo "Unreleased fragments present — will batch ${version}."
          elif [ -f ".changes/${version}.md" ]; then
            echo "Changelog .changes/${version}.md already batched — skipping batch."
          else
            echo "::error::No unreleased entries and no .changes/${version}.md. Nothing to release."
            exit 1
          fi

      - name: Extract version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install changie
        uses: miniscruff/changie-action@v3
        with:
          version: latest

      - name: Batch and merge changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # Idempotent: only batch when this version has not already been batched
          # (a release PR may pre-run `changie batch <version>`). `changie merge`
          # deterministically rebuilds CHANGELOG.md from the per-version files, so
          # it is always safe to run.
          if [ -f ".changes/${version}.md" ]; then
            echo "Skipping batch — .changes/${version}.md already exists."
            if [ -n "$(ls .changes/unreleased/ 2>/dev/null | grep -v .gitkeep)" ]; then
              echo "::warning::Unreleased fragments remain but ${version} is already batched — they will ship in a later version."
            fi
          else
            changie batch "$version"
          fi
          changie merge

      - name: Stamp version and regenerate manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 -m pip install --user pyyaml

          # Single version source: VERSION drives every generated manifest.
          echo "$VERSION" > VERSION

          # Regenerate plugin.json + marketplace.json from the registry (D-3).
          # Replaces the previous per-file jq version bumps — generate_manifests.py
          # is the sole writer of these files, so versions can never drift and the
          # metadata is reconciled from the single registry source each release.
          python3 scripts/generate_manifests.py .

          # --- TOML files: update version field (if present) ---
          if [ -f pyproject.toml ]; then
            sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
            echo "  ✓ pyproject.toml"
          fi

      - name: Commit version bump and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "chore: release ${TAG} — bump versions and update changelog"
            git push origin HEAD:main
          fi

      - name: Move tag to include release commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git tag -f "$TAG"
          git push origin "$TAG" --force

      - name: Prepare release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          cp ".changes/${version}.md" release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: false
