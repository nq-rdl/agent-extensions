name: Link Check

on:
  pull_request:
    paths:
      - skills/**/*.md
      - skills/speckit-*/**/*.rst
      - .github/workflows/link-check.yml

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --version

      - name: Check skill links
        # .md is checked repo-wide; .rst is scoped to the speckit-dev skills so we
        # monitor their doc-grounding links without failing on pre-existing
        # placeholder/rotted URLs in other skills' .rst (a separate hygiene pass
        # can widen this to skills/**/*.rst once those are cleaned/excluded).
        # Stylepedia returns 403 from GitHub runners even with its required headers
        # (PR #331, run 35185281164, attempts 1 and 2). The page and all anchors
        # pass uncached local checks. Scope this exception to CI and this page;
        # the bundled lychee config continues checking it for local users.
        run: >-
          bash skills/lychee/scripts/check-links.sh
          --exclude '^https://stylepedia\.net/style/(#.*)?$'
          'skills/**/*.md' 'skills/speckit-*/**/*.rst'
