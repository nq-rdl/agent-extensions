name: Link Check

# Advisory external (HTTP) link health for canonical skill docs. Local
# Markdown/RST file references are checked offline and deterministically by
# `asctl repo-check` in validate.yml; this job only covers network targets.
# Generated plugins/** and dist/** copies are not scanned. docs/, the root
# Markdown files, and hooks/skill assets are covered by the weekly
# link-rot-check.yml report (#301; docs/link-monitoring.md).
on:
  pull_request:
    paths:
      - skills/**/*.md
      - skills/**/*.rst
      # Files that control this check.
      - .github/workflows/link-check.yml
      - skills/lychee/scripts/check-links.sh
      - skills/lychee/lychee.toml
      - lychee.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --version
          lycheeVersion: v0.24.2

      - name: Check skill links
        # All canonical skill Markdown and RST, with the repository policy in
        # the root lychee.toml (narrow, commented exclusions only).
        # Stylepedia returns 403 from GitHub runners even with its required headers
        # (PR #331, run 35185281164, attempts 1 and 2). The page and all anchors
        # pass uncached local checks. Scope this exception to CI and this page;
        # the bundled lychee config continues checking it for local users.
        # lychee reads GITHUB_TOKEN; the widened scan makes enough github.com
        # requests that unauthenticated runs hit transient 429/503 rate limits.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash skills/lychee/scripts/check-links.sh
          --config lychee.toml --cache=false
          --exclude '^https://stylepedia\.net/style/(#.*)?$'
          'skills/**/*.md' 'skills/**/*.rst'
