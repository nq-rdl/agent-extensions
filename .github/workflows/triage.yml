name: Triage

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, ready_for_review]

# The called reusable workflow uses a GitHub App token (not GITHUB_TOKEN) for
# all writes, so the default token needs no permissions.
permissions: {}

jobs:
  triage:
    # Dependabot runs cannot read Actions secrets, so the App-token step in the
    # reusable workflow fails. Dependency-bump PRs don't need triage anyway.
    if: ${{ github.actor != 'dependabot[bot]' }}
    uses: nq-rdl/.github/.github/workflows/auto-triage.yml@main
    with:
      domain: RSE
    secrets: inherit
