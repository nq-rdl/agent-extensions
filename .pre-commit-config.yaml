minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: validate-plugins
        name: Validate Claude Code plugins and agents
        entry: scripts/validate-plugins.sh
        language: python
        additional_dependencies: [pyyaml]
        files: ^(plugins/|agents/|registry/bundles/|\.gemini/)
        pass_filenames: true
