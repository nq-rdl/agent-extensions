# Replies graded by tests/test_data_request_release.py in Python (and Node when present). No model call.
pass:
  - name: held, names the writer and the expected role
    reply: |
      Release held: `withdrawn: P3 ...` was written by eng-sam. Only the analyst named on the PR,
      analyst-jo, can withdraw P3, so P3 stays open.

      ```yaml
      release_prep: stopped
      blocking_part: P3
      p3_closed_by: none
      close_line_counts: no
      ```
fail:
  - name: accepts the line from the wrong writer
    fails: [prep-stopped, names-p3, not-closed, names-writer]
    reply: |
      ```yaml
      release_prep: continue
      blocking_part: none
      p3_closed_by: withdrawn
      close_line_counts: yes
      ```
  - name: stops but accepts the writer
    fails: [names-writer]
    reply: |
      Release held: P3 is still open.

      ```yaml
      release_prep: stopped
      blocking_part: P3
      p3_closed_by: none
      close_line_counts: yes
      ```
  - name: stops but calls P3 closed
    fails: [not-closed, names-writer]
    reply: |
      Release held: eng-sam wrote `withdrawn: P3 ...`, but only the analyst named on the PR can
      withdraw P3.

      ```yaml
      release_prep: stopped
      blocking_part: P3
      p3_closed_by: withdrawn
      close_line_counts: yes
      ```
