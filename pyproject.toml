[project]
authors = [{name = "rdl", email = "tsv-datalab@health.qld.gov.au"}]
dependencies = []
name = "agent-extensions"
requires-python = ">= 3.11"
version = "0.28.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# pixi manages ALL repo-local Python: the default environment carries
# python + pyyaml for the registry/pipeline scripts (invoke them via
# `pixi run`), and the `docs` environment adds zensical (linux-64 only).
# CI installs pyyaml with pip on its runners; end-user skill execution
# needs neither (Python skills bootstrap their own deps via ensure-deps.sh).
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = ">=3.11"
pyyaml = "*"

[tool.pixi.feature.docs]
platforms = ["linux-64"]

[tool.pixi.feature.docs.dependencies]
zensical = ">=0.0.31,<0.0.32"

# Drive Zensical for local docs review. Zensical lives only in the linux-64
# `docs` environment, so a plain `pixi install` (default env) does not carry
# it. These tasks are defined on the `docs` feature, so `pixi run zensical …`
# auto-selects the docs environment (and provisions it on first run) — no
# `-e docs` needed. Extra args are forwarded, so `pixi run zensical serve`,
# `pixi run zensical build`, etc. all work.
[tool.pixi.feature.docs.tasks]
zensical = "zensical"

[tool.pixi.environments]
docs = ["docs"]
