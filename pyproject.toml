[project]
authors = [{name = "rdl", email = "tsv-datalab@health.qld.gov.au"}]
dependencies = []
name = "agent-extensions"
requires-python = ">= 3.11"
version = "0.21.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# pixi manages ALL repo-local Python: the default environment carries
# python + pyyaml for the registry/pipeline scripts (invoke them via
# `pixi run`), and the `docs` environment adds zensical (linux-64 only).
# CI installs pyyaml with pip on its runners; end-user skill execution
# needs neither (Python skills bootstrap their own deps via ensure-deps.sh).
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = ">=3.11"
pyyaml = "*"

[tool.pixi.feature.docs]
platforms = ["linux-64"]

[tool.pixi.feature.docs.dependencies]
zensical = ">=0.0.31,<0.0.32"

[tool.pixi.environments]
docs = ["docs"]
