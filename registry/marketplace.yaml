# Marketplace-level metadata and entries NOT backed by a local bundle.
#
# plugin.json and marketplace.json are GENERATED from this file plus
# registry/bundles/*.yaml and VERSION by scripts/generate_manifests.py.
# Do NOT hand-edit the generated manifests — CI (generate_manifests.py --check)
# fails if they drift. This is the structural fix for #100's metadata rot.
name: rdl
owner:
  name: nq-rdl
  email: tsv-datalab@health.qld.gov.au
description: Agent extensions — curated skill bundles for Claude Code
pluginRoot: ./plugins

# Constant fields stamped into every generated plugins/<p>/.claude-plugin/plugin.json.
pluginDefaults:
  author:
    name: nq-rdl
  repository: https://github.com/nq-rdl/agent-extensions
  license: MIT

# Marketplace display order. Any enabled bundle missing from this list is
# appended alphabetically (with a ::warning::).
order:
  - go
  - rust
  - r
  - shiny
  - quarto
  - obsidian
  - writerside
  - defuddle
  - gh
  - terraform
  - kubernetes
  - argo-cd
  - ansible
  - arch-linux
  - starrocks
  - postgres
  - mongodb
  - sops
  - bitwarden
  - pixi
  - lychee
  - charm-tui
  - claude-code
  - opencode-dev
  - rdl-team
  - playwright
  - planning
  - debug
  - tech-writing
  - lucid

# External plugins are NOT re-hosted in this marketplace. They are consumed from
# their own upstream marketplaces, registered for the team in .claude/settings.json
# via `extraKnownMarketplaces`. See docs/external-marketplaces.md.

# D-1 meta-plugin: a content-less plugin that declares every local subject plugin
# as a dependency, so `claude plugin install rdl@rdl` installs the whole set and
# `claude plugin uninstall rdl --prune` cleans up. The dependency list is
# generated from the enabled bundles. Emitted only when enabled.
meta:
  name: rdl
  enabled: true
  description: Install the full RDL agent-extensions set — every subject plugin in one command
  keywords:
    - meta
    - install
    - rdl
