schemaVersion: v1
id: redhat
displayName: Red Hat
description: Red Hat — fetch product documentation and Customer Portal (KCS) content with your own credentials via curl, on macOS and Linux
keywords: [redhat, documentation, customer-portal, kcs, curl, openshift, ansible]
owners:
  - rdl
channels:
  - stable
skills:
  - {source: redhat-docs-fetch, leaf: fetch-docs}   # → /redhat:fetch-docs
  - {source: redhat-setup, leaf: setup}             # → /redhat:setup
hooks: [redhat-docs-preflight, redhat-docs-guard]
prompts: []
mcp: []
targets:
  claude:
    enabled: true
    pluginName: redhat
    marketplaceName: rdl-agent-extensions

  codex:
    enabled: true
    pluginName: redhat
    marketplaceName: rdl-agent-extensions
    category: Developer Tools
    components:
      skills: true
      mcp: false
      hooks: true
      apps: false
    interface:
      shortDescription: Red Hat tools and workflows
      defaultPrompt:
      - Use Red Hat to help with my task.
    hookConfig: hooks/codex/redhat/hooks.json
    notes:
      sharedHooks:
      - redhat-docs-preflight
      - redhat-docs-guard
