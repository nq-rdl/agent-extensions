schemaVersion: v1
id: sql-review
displayName: SQL Review
description: SQL Review — scope, analyse and explain SQL with standardised, human-confirmed assumption and limitation reports
keywords: [sql, review, data-engineering, assumptions, limitations, handoff]
owners:
  - rdl
channels:
  - stable
skills:
  - {source: sql-review-setup, leaf: setup}          # → /sql-review:setup
  - {source: sql-review-bootstrap, leaf: bootstrap}  # → /sql-review:bootstrap
  - {source: sql-review-analyse, leaf: analyse}      # → /sql-review:analyse
  - {source: sql-review-explain, leaf: explain}      # → /sql-review:explain
hooks: [sql-review-preflight, sql-review-guard]
prompts: []
mcp: []
targets:
  claude:
    enabled: true
    pluginName: sql-review
    marketplaceName: rdl-agent-extensions
