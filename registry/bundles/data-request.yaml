schemaVersion: v1
id: data-request
displayName: Data Request
description: Data Request — triage, scope, lookup, map, draft, validate, fix and amend request SQL and Python, and draft analyst-approved release summaries, with shared RDL guardrails and human-confirmed review handoffs
keywords: [data-request, triage, sql, python, cohort, guardrails, lookup, mapping, drafting, validation, fixes, amendments, review, handoff, release]
owners:
  - rdl
channels:
  - stable
skills:
  - {source: data-request-setup, leaf: setup}          # → /data-request:setup
  - {source: data-request-bootstrap, leaf: bootstrap}  # → /data-request:bootstrap
  - {source: data-request-analyse, leaf: analyse}      # → /data-request:analyse
  - {source: data-request-explain, leaf: explain}      # → /data-request:explain
  - {source: data-request-release, leaf: release}      # → /data-request:release
  - {source: data-request-guardrails, leaf: guardrails}
  - {source: data-request-lookup, leaf: lookup}
  - {source: data-request-map, leaf: map}
  - {source: data-request-draft, leaf: draft}
  - {source: data-request-validate, leaf: validate}
  - {source: data-request-fix, leaf: fix}
  - {source: data-request-amend, leaf: amend}          # → /data-request:amend
  - {source: data-request-lift, leaf: lift}
  - {source: data-request-triage, leaf: triage}      # → /data-request:triage
hooks: [data-request-preflight, data-request-guard]
prompts: []
mcp: []
targets:
  claude:
    enabled: true
    pluginName: data-request
    marketplaceName: rdl-agent-extensions

  codex:
    enabled: true
    pluginName: data-request
    marketplaceName: rdl-agent-extensions
    category: Developer Tools
    components:
      skills: true
      mcp: false
      hooks: true
      apps: false
    interface:
      shortDescription: Develop and review SQL; fix request SQL and Python
      defaultPrompt:
      - Use Data Request to help with my task.
    hookConfig: hooks/codex/data-request/hooks.json
    notes:
      sharedHooks:
      - data-request-preflight
      - data-request-guard
