schemaVersion: v1
id: rdl-team
displayName: RDL Team
description: RDL team workflows — Claude Code onboarding, setup, and config management
keywords: [rdl, team, onboarding, claude-code, setup]
owners:
  - rdl
channels:
  - stable
skills:
  - {source: cc-setup, leaf: cc-setup}
  - new-service-request
  - {source: marketplace-scout, leaf: discover-plugins}  # guest — home: claude-code
hooks: []
prompts: []
mcp: []
targets:
  claude:
    enabled: true
    pluginName: rdl-team
    marketplaceName: rdl-agent-extensions

  codex:
    enabled: true
    pluginName: rdl-team
    marketplaceName: rdl-agent-extensions
    category: Developer Tools
    components:
      skills: true
      mcp: false
      hooks: false
      apps: false
    interface:
      shortDescription: RDL service requests and Claude Code onboarding
      defaultPrompt:
      - Use RDL Team to help with my task.
