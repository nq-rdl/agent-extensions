# Consumer defaults, selected by the wrapper unless a config is passed explicitly.
# Repository-specific exceptions belong in the consumer's own configuration.

# Bound iterative caching; use --cache=false when verifying current link health.
cache = true
max_cache_age = "1h"

# String fragment modes require lychee >=0.24.0.
include_fragments = "anchor-only"
max_concurrency = 32
timeout = 30
max_retries = 3

exclude = [
  # RFC 2606 names, including subdomains. End the host before a port/path/query/
  # fragment (or end of URL), so example.commercial and example.com.real.org run.
  '^https?://([a-z0-9-]+\.)*example\.(com|net|org)\.?(:[0-9]+)?([/?#]|$)',
  '^https?://([a-z0-9-]+\.)*(test|example|invalid|localhost)\.?(:[0-9]+)?([/?#]|$)',
  # Unspecified local address; private/loopback/link-local IPs use the flag below.
  '^https?://0\.0\.0\.0(:[0-9]+)?([/?#]|$)',
  '^mailto:',
]
exclude_all_private = true

# Successful/informational responses only; failures keep their normal status.
accept = ["100..=103", "200..=299"]
extensions = ["md", "mdx", "txt", "rst", "html", "yaml", "yml", "toml", "json"]
