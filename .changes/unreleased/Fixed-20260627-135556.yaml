body: 'Rework the cc-web-setup skill (`/claude-code:web-setup`) so Claude Code on the web sessions have the team''s skills and slash-commands available on the FIRST session. Vendoring skills/agents into `.claude/` (part of the repo clone, enumerated before any network step) is the single first-session route. Declarative `enabledPlugins` is documented as best-effort config for plugins that ship real behavior (hooks/MCP/LSP): its web activation is unverified — external marketplaces 403 over the in-sandbox git proxy, the install races skill enumeration (anthropics/claude-code#63028), and the sandbox is ephemeral — so it is not a first-session guarantee. An advanced HTTPS-fetch escape hatch (documented, no shipped script) covers the rare skill a team cannot commit.'
