kind: Fixed
body: 'Rework the cc-web-setup skill (`/claude-code:web-setup`) so Claude Code on the web sessions have the team''s skills and slash-commands available on the FIRST session. Vendoring skills/agents into `.claude/` (part of the repo clone, enumerated before any network step) is now the documented default; a new opt-in `.claude/scripts/bootstrap-web.sh` SessionStart hook HTTPS-tarball-fetches skills listed in `.claude/web-skills.json` into `~/.claude/skills/` and returns `reloadSkills: true` for same-session availability. Declarative `enabledPlugins` is now documented as a best-effort layer (plugin namespacing/autoUpdate from session 2+), since a SessionStart plugin install lands in the plugin cache that `reloadSkills` does not re-scan — and can hang web sessions (anthropics/claude-code#18088) — so it cannot surface a plugin the same session.'
