kind: Fixed
body: 'cc-web-setup: stop `/claude-code:web-setup` (and the `marketplace-scout` agent) from generating non-existent plugin ids — an id whose `@marketplace` is real but whose plugin name does not exist (e.g. a guessed `pyright-lsp@claude-plugins-official` or `<lang>-lsp`), which passed the `cover`/`ensure` suffix guards and then sat in `.claude/settings.json` as "Declared but NOT installed" forever (failure mode #5, dataops#169). Adds a `web-settings.sh verify` subcommand that fetches each marketplace catalog and flags enabled ids absent from it (distinguishing a genuinely non-existent id from an unreachable-marketplace one, the git-403 case), a `web-setup-plugin-check` PostToolUse hook in the `claude-code` plugin that runs `verify` whenever `.claude/settings.json` is written during a setup session, and a `marketplace-scout` no-guessing rule (never recommend an id not read from a fetched catalog or the curated `marketplaces.json`). Wires `verify` into SKILL.md Phase 2/4 and documents the failure mode in references/web-setup.rst.'
time: 2026-06-24T09:00:00.000000000Z
