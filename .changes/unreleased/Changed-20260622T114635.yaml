kind: Changed
body: '`Claude Code on the web` / local dev: consolidate the web bootstrap into a single `.claude/scripts/install-deps.sh` engine with one ergonomic entrypoint, `make install-deps`. Three modes from one script: `make install-deps` provisions the local dev toolchain (lefthook, changie, gopls, python/jq) for human contributors; `CLAUDE_CODE_REMOTE=true make install-deps` (the documented Setup-script field) additionally pre-seeds the declared plugins into the snapshot BEFORE Claude enumerates skills — the only way `/<plugin>:<skill>` commands appear on the first web session; and `install-deps.sh --session` (the SessionStart hook) self-heals on resumes. Moves `.claude/hooks/{web-bootstrap,web-bootstrap.local,announce-capabilities}.sh` to `.claude/scripts/install-deps{,.local}.sh` + `announce-capabilities.sh`, adds a root Makefile, and documents the mechanism in CONTRIBUTING.md (correcting the disproven "the platform installs enabledPlugins at session start" claim)'
