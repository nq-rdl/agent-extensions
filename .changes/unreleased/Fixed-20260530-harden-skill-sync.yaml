kind: Fixed
body: Harden the skill sync so an upstream rename or removal no longer silently breaks it — `sync-plugins.sh` now warns and skips unresolved registry references (and prunes stale plugin copies) instead of aborting before the PR is opened, `validate.yml` remains the authoritative gate, and `sync-skills.yml` opens a tracking issue on failure.
