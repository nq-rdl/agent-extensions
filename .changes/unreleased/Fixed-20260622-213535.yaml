kind: Fixed
body: '`cc-web-setup`: the `ensure_plugins` self-heal now refreshes the marketplace index (`claude plugin marketplace update <marketplace>`) and retries once when a `claude plugin install` fails — recovering the common cold-VM case where the marketplace is registered but its local index is stale (`claude plugin install` reports "Plugin not found in marketplace … your local copy may be out of date" and does not refresh the index itself). Previously the retry re-ran the same failing install against the same stale index and could not recover; the set only installed once the platform refreshed the index on a later session. The "Declared but NOT installed" note in `announce-capabilities.sh` and the self-heal warning now name the stale-index cause, not just an unreachable source. Adds `ensure_plugins` coverage (healthy-index, stale-index recovery, already-present no-op, unreachable) to `test-install-deps.sh`.'
time: 2026-06-22T21:35:35.886845109Z
