kind: Fixed
body: '`Claude Code on the web`: install the declared `enabledPlugins` from `web-bootstrap.sh` (new `ensure_plugins`), reading the set straight from `.claude/settings.json`. The platform registers `extraKnownMarketplaces` at session start but does NOT install the enabled plugins from them (verified live on 2.1.185) — so after #160 removed the install machinery, a fresh cloud env had every marketplace registered yet zero plugins installed and no `/<plugin>:<skill>` commands. The install is idempotent (skips plugins already in `claude plugin list`) and non-fatal. `announce-capabilities.sh` now surfaces a one-time "web setup active — commit, plugins appear next session" note when a plugin was freshly installed, and its stale "platform installs plugins at session start" comments are corrected'
