kind: Changed
body: '`claude-code:web-setup` (cc-web-setup) skill: provision plugins declaratively via `.claude/settings.json` (`extraKnownMarketplaces` + `enabledPlugins`, installed at cloud session start) instead of an imperative pre-snapshot `claude plugin install`. Removed the plugin pre-seed machinery from `cc-web-setup.sh` (now a thin, optional seam for baking heavy non-plugin deps into the snapshot via `cc-web-setup.local.sh`) and the `CC_WEB_MARKETPLACES`/`CC_WEB_PLUGINS` env vars. Added a Phase 2 marketplace-consistency guard ensuring every enabled plugin''s `@marketplace` is declared in `extraKnownMarketplaces` (auto-adding known ones like `claude-plugins-official`, stopping to ask on unknowns) so plugins can no longer silently fail to install (#157), a Phase 0 self-marketplace guard that avoids enabling a repo''s own published plugins and shadowing working-tree edits (#149), and made `announce-capabilities.sh` report plugins as configured rather than installed.'
time: 2026-06-22T09:03:52.110949497+00:00
