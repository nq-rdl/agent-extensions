kind: Changed
body: '`cc-web-setup` / `claude-code:web-setup` skill: re-scope to teach the verified Claude Code web mechanism (issue #161). Claude Code on the web registers `extraKnownMarketplaces` but does NOT install `enabledPlugins`, so the skill now ships a portable `.claude/scripts/install-deps.sh` engine (exposed as `make install-deps`) that installs the declared set itself, documents the pre-snapshot Setup-script field (`CLAUDE_CODE_REMOTE=true make install-deps`) as the only first-session path, the `--session` SessionStart self-heal for resumes, and the `announce-capabilities.sh` "declared ≠ installed ≠ surfaced" canary. Removes the disproven pre-snapshot `cc-web-setup.sh` plugin pre-seed + `make cc-web-setup` apparatus and the "the platform installs plugins at session start" framing; adds the anti-pattern note (no self-referential meta-marketplace in its own dev env) and scopes the Setup-script/`*.local.sh` seam to non-plugin provisioning (Docker, heavy deps)'
