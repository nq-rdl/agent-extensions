kind: Changed
body: '`Claude Code on the web`: plugins are installed DECLARATIVELY by the platform at session start from the marketplace declared in `.claude/settings.json` (per the web docs'' "what carries over" table) — so remove the overbuilt install machinery added in #162: the root `Makefile`/`make install-deps` Setup-script entrypoint, the three-mode engine, and every "the platform does not install enabledPlugins" claim. `install-deps.sh` is now a plain `CLAUDE_CODE_REMOTE`-gated SessionStart hook that provisions only non-plugin tooling (gh/codex CLIs, the project dev toolchain + Docker via `install-deps.local.sh`) plus a cheap idempotent `ensure_plugins` SELF-HEAL for the docs'' "requires network access to reach the marketplace source" failure mode. The `cc-web-setup` skill, CONTRIBUTING.md, and announce-capabilities.sh are re-scoped to the declarative model; no Setup-script field and no manual per-environment step are required'
