kind: Changed
body: 'All 31 bundled subagents now pin `model: sonnet` (the auto-updating alias, which resolves to Sonnet 5 on the Anthropic API) instead of `model: inherit`, and each declares an explicit reasoning `effort`. The default is `effort: medium`; three narrow, prescriptively-guided agents run at `effort: low` (`adr-generator`, `repo-architect`, `jules-orchestrator`). Previously these agents inherited the parent session''s model and effort; they now run on a consistent Sonnet tier at a deliberate baseline effort, with deeper reasoning reserved for the design/security/debugging/code-generation agents that benefit from it. Note: the `sonnet` alias resolves to Sonnet 5 on the Anthropic API but to Sonnet 4.5 on Bedrock/Vertex unless overridden via `ANTHROPIC_DEFAULT_SONNET_MODEL`. Also drops an invalid `max_turns` frontmatter key from `gem-reviewer` (the valid `maxTurns` is retained).'
