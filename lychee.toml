# Catalog CI/local-hook policy, selected explicitly with --config lychee.toml.
# Exclusions moved from skills/lychee/lychee.toml for #299 and reviewed for #300.
# They are not consumer defaults or evidence of current URL health. Add only
# narrow, commented patterns for URLs that ordinary HTTP page checks cannot
# verify (API endpoints, identifiers, bot-blocked hosts); fix rot and use
# RFC 2606 hosts or <placeholder> segments for examples (CONTRIBUTING.md).

# Verification must make fresh requests, even if .lycheecache already exists.
cache = false

# Check intra-document anchor fragments (#section-name); v0.24 needs a string mode, not a boolean
include_fragments = "anchor-only"

# Max concurrent requests — throttle to avoid rate limiting
max_concurrency = 32

# Timeout per request (seconds) — allow slow documentation hosts time to respond
timeout = 60

# Max retries for transient failures
max_retries = 3

# Exclude common false-positive patterns
exclude = [
  # Localhost/example URLs, anchored at the end of the host so look-alike
  # hosts (example.com.real.org, localhost.company.org) are still checked.
  # lychee itself skips example.net, *.example.{com,org,net}, .example, .test,
  # .invalid and .localhost.
  "^https?://localhost(?:[:/?#]|$)",
  "^https?://127\\.0\\.0\\.",
  "^https?://0\\.0\\.0\\.0(?:[:/?#]|$)",
  "^https?://example\\.com(?:[:/?#]|$)",
  "^https?://example\\.org(?:[:/?#]|$)",
  # Template placeholders ($VAR, {{ var }}) where the whole host is variable.
  "^https?://\\$",
  "^https?://\\{\\{",
  # Email addresses (often not real in docs)
  "^mailto:",
  # Private GitHub repositories
  # "^https://github\\.com/your-org/"  # add org-specific exclusions here
  # Team spec-kit catalog (may be private) — referenced by speckit-dev skills/hook
  "^https://github\\.com/nq-rdl/spec-kit-extensions",
  "^https://raw\\.githubusercontent\\.com/nq-rdl/spec-kit-extensions",
  # Private RDL repositories linked by the data-request skills (resolve for org members only)
  "^https://github\\.com/nq-rdl/(query-builder|documentation|data-analysis-scaffold)/",
  # RDL Planning project board, linked from README.md (weekly link-rot scan, #301).
  # The project is private (projectV2 public: false), so GitHub answers 404 to
  # anonymous requests; that is an access boundary, not rot.
  "^https://github\\.com/orgs/nq-rdl/projects/1/?$",
  # RDL Service Desk (access-controlled) — referenced by the new-service-request skill
  "^https://github\\.com/rdl-service-desk/service-desk",
  # Red Hat: docs.redhat.com bot-blocks non-browser clients (Akamai 403 — see redhat plugin,
  # nq-rdl/agent-extensions#261) and the API-token page is login-gated — referenced by the redhat skills
  "^https?://docs\\.redhat\\.com/",
  "^https://access\\.redhat\\.com/management/api",
  # Australian Government Style Manual — referenced by tech-writing-copyedit. lychee on
  # GitHub runners still fails with "HTTP/2 protocol error" (re-confirmed in run
  # 36407979723, 2026-09-28); curl, browsers and local lychee succeed.
  "^https?://www\\.stylemanual\\.gov\\.au/",
  # Remote MCP server endpoints in OpenCode config examples
  # (opencode-tools references/mcp-servers.rst). They speak MCP over POST; a
  # plain GET answers 405 (context7, grep.app) or 401 (sentry).
  "^https://mcp\\.context7\\.com/mcp$",
  "^https://mcp\\.grep\\.app/?$",
  "^https://mcp\\.sentry\\.dev/mcp$",
  # GitHub Actions OIDC issuer identifier (cosign --certificate-oidc-issuer in
  # pixi references/security.rst). Not a page: the root 404s while its
  # /.well-known/openid-configuration answers 200.
  "^https://token\\.actions\\.githubusercontent\\.com/?$",
  # conda-forge channel URL used as a pixi mirror key (pixi references/
  # pixi_pack.rst). Without the trailing slash the channel root answers 404;
  # the key must match the channel spelling, so it is not rewritten.
  "^https://conda\\.anaconda\\.org/conda-forge$",
  # PyPI simple index root in a pixi.lock example (pixi references/
  # first_workspace.rst). It is a package index endpoint, not a page, and answers
  # 503 to plain GETs (GitHub run 36408792886 and locally, 2026-09-28).
  "^https://pypi\\.org/simple/?$",
  # Red Hat Customer Portal API endpoints documented by redhat-docs-fetch
  # (references/customer-portal-api.rst): search needs Solr parameters (400
  # without), the token endpoint is POST-only (405), /support is an API base
  # (404), and rs/solutions/ is the documented decommissioned Strata API (410).
  "^https://api\\.access\\.redhat\\.com/(support|support/search/kcs|rs/solutions/)$",
  "^https://access\\.redhat\\.com/hydra/rest/search/kcs$",
  "^https://sso\\.redhat\\.com/auth/realms/redhat-external/protocol/openid-connect/token$",
]

# Exclude private/loopback IPs
exclude_all_private = true

# Accept common redirect status codes
accept = ["100..=103", "200..=299"]

# File extensions to check
extensions = ["md", "mdx", "txt", "rst", "html", "yaml", "yml", "toml", "json"]

# Stylepedia returns 403 to requests without these content-negotiation headers.
# Keep HTTP status and fragment checking enabled; do not exclude the guide.
[hosts."stylepedia.net"]
headers = { "Accept" = "text/html", "Accept-Language" = "en-US,en;q=0.9" }

# docs.conda.io answered 429 Too Many Requests to GitHub runners on 3 of 5 Link
# Check attempts during #414 (runs 36407979723, 36408792886 and 36409735793;
# reruns and local checks pass). The URL is skills/pixi/references/
# pixi_pack.rst:345. Throttle this host (one request at a time, retries spaced
# out) instead of excluding it, so the PR check and the weekly link-rot scan
# (#301) keep checking it; a remaining 429 is reported as unknown, not rot.
[hosts."docs.conda.io"]
concurrency = 1
request_interval = "5s"

# testcontainers.com guide links time out under bursts on GitHub runners
# (run 36678363149). Throttle this host instead of excluding it, so the
# skill guides still receive HTTP and fragment checks.
[hosts."testcontainers.com"]
concurrency = 2
request_interval = "1s"
