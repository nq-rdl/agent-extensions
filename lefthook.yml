# Local git hooks for contributors — a local mirror of the CI checks in
# .github/workflows/ so failures surface before you push. Managed by lefthook
# (https://lefthook.dev).
#
# Activate:  lefthook install
# Prereqs:   lefthook, Go (asctl), pixi (provides python3 + pyyaml for the
#            registry scripts — jobs invoke them via `pixi run`).
# Optional:  lychee (link check), Docker (SkillSpector pre-push scan), claude CLI
#            >= 2.1.269 (plugin eval pre-push job).
# Bypass:    LEFTHOOK=0 git commit ...   |   git commit --no-verify
min_version: 1.9.0

pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  jobs:
    # --- Go: asctl (the only Go module in-repo) ---
    - name: go-fmt-asctl
      root: tools/asctl/
      glob: "*.go"
      run: test -z "$(gofmt -l {staged_files})"

    - name: go-vet-asctl
      root: tools/asctl/
      glob: "*.go"
      run: go vet ./...

    - name: go-build-asctl
      root: tools/asctl/
      glob: "*.go"
      run: CGO_ENABLED=0 go build ./...

    # --- Skills: agentskills.io spec + directory-structure standard ---
    # Build to a temp path and run from repo root (asctl resolves skills/
    # relative to its working directory, which must stay the repo root).
    - name: asctl-repo-check
      glob: "skills/**"
      run: |
        bin="$(mktemp -d)/asctl"
        CGO_ENABLED=0 go -C tools/asctl build -o "$bin" ./cmd/asctl
        "$bin" repo-check

    # --- Plugin manifests / hooks / skills are well-formed ---
    - name: validate-plugins
      glob: "{.agents/**,plugins/**,dist/codex/plugins/**,hooks/codex/**,scripts/**,registry/bundles/**}"
      run: pixi run bash scripts/validate-plugins.sh

    # --- Generated artifacts are in sync with the registry (catches a
    #     forgotten sync-plugins.sh / regenerate before CI does) ---
    - name: generated-in-sync
      glob: "{.agents/**,registry/**,skills/**,plugins/**,dist/codex/plugins/**,hooks/**,scripts/**,VERSION}"
      run: |
        pixi run python3 scripts/check_bundle_refs.py .
        pixi run python3 scripts/check_grouping.py .
        pixi run python3 scripts/check_consistency.py .
        pixi run bash scripts/sync-plugins.sh --check
        pixi run python3 scripts/generate_manifests.py . --check
        pixi run python3 scripts/generate_bundles_doc.py . --check
        pixi run python3 scripts/codex_directory.py . --check

    # --- Eval regex graders are generated from graders.spec.yaml (the unit tests
    #     gate this in CI; this catches a forgotten regenerate before the push).
    - name: eval-graders-in-sync
      glob: "{evals/claude/**,scripts/generate_eval_graders.py}"
      run: pixi run python3 scripts/generate_eval_graders.py . --check

    # --- Reverse-exposure reminder. Just a nudge: a new skill/agent/hook/mcp
    #     that no bundle references yet is easy to miss locally. --warn always
    #     exits 0 (non-blocking); CI's strict `check_exposure.py .` is the hard
    #     gate (validate.yml).
    - name: exposure-reminder
      glob: "{skills/**,hooks/**,mcp/**,registry/bundles/**,registry/unbundled.yaml}"
      run: pixi run python3 scripts/check_exposure.py . --warn

    # --- Changie fragment length. Each staged unreleased fragment's body must
    #     stay under the per-fragment cap (default 200; CHANGIE_MAX_BODY_LENGTH
    #     overrides). Changie's own body.maxLength guards `changie new`; this
    #     catches fragments written directly. It also fails on a fragment whose
    #     YAML does not parse (e.g. an unquoted `body:` containing `: `), which
    #     would otherwise only break release `changie batch`. On failure the
    #     script prints the split-into-multiple-fragments reminder. ---
    - name: changie-length
      glob: ".changes/unreleased/*.yaml"
      run: pixi run python3 scripts/check_changie_length.py {staged_files}

    # --- Docs link health. With lychee installed, a broken link in a staged
    #     skill .md fails the commit (the old `|| true` wrongly swallowed real
    #     failures). When lychee is absent we skip cleanly; CI (link-check.yml)
    #     still enforces link health over the full skills/ tree. ---
    - name: lychee-links
      glob: "skills/**/*.md"
      run: |
        if command -v lychee >/dev/null 2>&1; then
          skills/lychee/scripts/check-links.sh {staged_files}
        else
          echo "lychee not installed; skipping link check (CI still enforces it)."
        fi

commit-msg:
  # Non-blocking changie reminder. Prints a hint when no fragment was staged on
  # this branch; never fails. Hard enforcement lives in pre-push.
  jobs:
    - name: changie-hint
      run: |
        base=$(git merge-base HEAD origin/main 2>/dev/null || echo "")
        if [ -n "$base" ] && ! git diff --name-only --diff-filter=A "$base"...HEAD -- '.changes/unreleased/*.yaml' 2>/dev/null | grep -q .; then
          echo ""
          echo "hint: no changie fragment added on this branch yet."
          echo "hint: run 'changie new' before pushing, or add the 'skip-changelog' label to the PR."
        fi
        exit 0

pre-push:
  parallel: true
  jobs:
    - name: go-test-asctl
      root: tools/asctl/
      glob: "{*.go,go.mod,go.sum}"
      run: go test -count=1 ./...

    # Git exports GIT_DIR (and, depending on the hook, GIT_WORK_TREE /
    # GIT_INDEX_FILE) into hooks, e.g. when pushing from a linked worktree.
    # Tests that build throwaway repos in a temp dir would inherit it and run
    # their git commands against THIS repo (rewriting refs, HEAD, index and
    # config), so clear them. CI runs with none of them set.
    - name: python-unit-tests
      glob: "{scripts/**,tests/**}"
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE pixi run python3 -m unittest discover -s tests -p 'test_*.py'

    - name: codex-js-tests
      glob: "{plugins/codex/**,tests/codex/**,hooks/codex-*.sh}"
      run: node --test tests/codex/*.test.mjs

    # Informational: report findings but never block the push (CI uploads the
    # SARIF to the Security tab). scan.sh skips itself when Docker is absent;
    # set SKILLSPECTOR_SKIP=1 to skip explicitly.
    - name: skillspector
      glob: "skills/**"
      run: tools/skillspector/scan.sh || true

    # Local-only (no CI twin) and OPT-IN: `claude plugin eval` makes paid,
    # non-deterministic model calls, so this job is a no-op unless
    # CLAUDE_EVAL_ENABLE=1. When enabled it evaluates plugins whose
    # evals/claude/<plugin>/ suite or plugin tree changed in the pushed commits
    # (staged from the pushed revision, read from git's pre-push stdin — never the
    # working tree). Informational unless CLAUDE_EVAL_STRICT=1. It runs in
    # parallel with the hard gates below, so a rejected push still spends.
    - name: claude-plugin-eval
      glob: "{evals/claude/**,plugins/**,scripts/eval-*.sh}"
      use_stdin: true
      run: scripts/eval-changed-plugins.sh

    # Hard gate, mirrors .github/workflows/changelog-check.yml. Bypass locally
    # with CHANGIE_SKIP=1 (use the 'skip-changelog' PR label for CI).
    - name: changie-fragment
      run: |
        if [ "${CHANGIE_SKIP:-0}" = "1" ]; then
          echo "CHANGIE_SKIP=1 set; skipping changie fragment check."
          exit 0
        fi
        base=$(git merge-base HEAD origin/main 2>/dev/null)
        if [ -z "$base" ]; then
          echo "cannot resolve merge-base with origin/main; skipping changie check"
          exit 0
        fi
        if ! git diff --name-only --diff-filter=A "$base"...HEAD -- '.changes/unreleased/*.yaml' | grep -q .; then
          echo "error: no changie fragment added on this branch."
          echo "  run: changie new   (or set CHANGIE_SKIP=1 to bypass locally)"
          exit 1
        fi
